name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # 検出と読み取り(`slow` の印)は走らせないので，重い依存は入れない．
      # torch・ultralytics・easyocr を入れると，導入だけで 5 分を超える
      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install pytest streamlit pandas numpy pillow opencv-python-headless rapidfuzz python-Levenshtein

      - name: テスト
        run: pytest -q
