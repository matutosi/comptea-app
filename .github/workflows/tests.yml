name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 下限 (pyproject の requires-python) と，手元で使う版の両方で回す
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 検出と読み取り(`slow` の印)は走らせないので，重い依存は入れない．
      # torch・ultralytics・easyocr を入れると，導入だけで 5 分を超える
      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: テスト
        run: pytest -q
